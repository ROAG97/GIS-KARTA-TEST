<!DOCTYPE html>

<html lang="sv">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Admin login – Skånelinjen
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #1d1d1d;

            color: white;
        }


        .login-card {

            width: min(
                420px,
                100%
            );

            padding: 35px;

            background: #292929;

            border: 1px solid #383838;

            border-radius: 12px;
        }


        h1 {

            margin:
                0
                0
                8px;

            font-size: 30px;
        }


        .subtitle {

            margin:
                0
                0
                30px;

            color: #aaa;
        }


        .form-group {

            margin-bottom: 20px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            font-size: 12px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: .7px;
        }


        input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #555;

            border-radius: 7px;

            background: #1d1d1d;

            color: white;

            font-size: 16px;
        }


        input:focus {

            outline: none;

            border-color: #aaa;
        }


        button {

            width: 100%;

            padding: 13px;

            margin-top: 5px;

            border: none;

            border-radius: 7px;

            background: white;

            color: #111;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;
        }


        button:hover {

            background: #ddd;
        }


        .error {

            margin-bottom: 20px;

            padding: 11px 13px;

            border-radius: 6px;

            background: #582929;

            color: #ffdada;

            font-size: 14px;
        }

    </style>

</head>


<body>


<div class="login-card">


    <h1>
        Admin
    </h1>


    <p class="subtitle">
        Logga in för att redigera värn.
    </p>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form method="POST">


        <div class="form-group">

            <label for="username">
                Användarnamn
            </label>

            <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                required
                autofocus
            >

        </div>


        <div class="form-group">

            <label for="password">
                Lösenord
            </label>

            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >

        </div>


        <button type="submit">
            Logga in
        </button>


    </form>


</div>


</body>

</html>
