<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Databas – Admin</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #1d1d1d;
            color: white;
        }


        /* =================================
           SIDA
           ================================= */

        .admin-page {
            width: min(
                1100px,
                calc(100% - 32px)
            );

            margin:
                40px
                auto
                80px;
        }


        /* =================================
           TOPP
           ================================= */

        .back-link {
            display: inline-flex;

            margin-bottom: 22px;

            color: #aaa;

            text-decoration: none;

            font-size: 14px;
        }

        .back-link:hover {
            color: white;
        }

        .admin-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 20px;

            margin-bottom: 30px;
        }

        .admin-header h1 {
            margin: 0;

            font-size: 36px;
        }


        /* =================================
           KNAPPAR
           ================================= */

        .button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            padding: 11px 17px;

            border: 1px solid #555;
            border-radius: 8px;

            background: #292929;
            color: white;

            text-decoration: none;

            font-size: 14px;

            cursor: pointer;
        }

        .button:hover {
            background: #353535;
        }

        .button-primary {
            background: white;
            border-color: white;

            color: #1d1d1d;

            font-weight: 700;
        }

        .button-primary:hover {
            background: #ddd;
        }


        /* =================================
           POSTER
           ================================= */

        .post-list {
            display: grid;

            gap: 12px;
        }

        .post-card {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 20px;

            padding: 20px;

            border: 1px solid #383838;
            border-radius: 10px;

            background: #292929;
        }

        .post-info {
            min-width: 0;
        }

        .post-category {
            display: block;

            margin-bottom: 6px;

            color: #999;

            font-size: 11px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: .7px;
        }

        .post-title {
            margin:
                0
                0
                5px;

            font-size: 20px;
        }

        .post-slug {
            margin: 0;

            color: #888;

            font-size: 13px;
        }

        .post-actions {
            display: flex;

            align-items: center;

            gap: 10px;
        }


        /* =================================
           STATUS
           ================================= */

        .status {
            padding: 5px 9px;

            border: 1px solid #444;
            border-radius: 20px;

            color: #aaa;

            font-size: 11px;
        }

        .status-published {
            color: white;
        }


        /* =================================
           TOM DATABAS
           ================================= */

        .empty-state {
            padding: 30px;

            border: 1px solid #383838;
            border-radius: 10px;

            background: #292929;

            color: #aaa;

            text-align: center;
        }


        /* =================================
           MOBIL
           ================================= */

        @media (max-width: 650px) {

            .admin-page {
                width: calc(100% - 24px);

                margin-top: 24px;
            }

            .admin-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .admin-header h1 {
                font-size: 30px;
            }

            .post-card {
                align-items: flex-start;
                flex-direction: column;
            }

            .post-actions {
                width: 100%;
            }

        }

    </style>

</head>


<body>

<main class="admin-page">

    <a
        href="{{ url_for('admin') }}"
        class="back-link"
    >
        ← Tillbaka till admin
    </a>


    <header class="admin-header">

        <h1>
            Databas
        </h1>

<a
    href="{{ url_for('admin_databas_new') }}"
    class="button button-primary"
>
    + Ny databaspost
</a>

    </header>


    {% if posts %}

    <section class="post-list">

        {% for post in posts %}

        <article class="post-card">

            <div class="post-info">

                <span class="post-category">
                    {{ post.category }}
                </span>

                <h2 class="post-title">
                    {{ post.title }}
                </h2>

                <p class="post-slug">
                    /databas/{{ post.slug }}
                </p>

            </div>


            <div class="post-actions">

                {% if post.published %}

                    <span class="status status-published">
                        Publicerad
                    </span>

                {% else %}

                    <span class="status">
                        Utkast
                    </span>

                {% endif %}


<a
    href="{{ url_for('admin_databas_edit', post_id=post.id) }}"
    class="button"
>
    Redigera
</a>

            </div>

        </article>

        {% endfor %}

    </section>


    {% else %}

        <div class="empty-state">
            Det finns inga databasposter ännu.
        </div>

    {% endif %}

</main>

</body>

</html>
